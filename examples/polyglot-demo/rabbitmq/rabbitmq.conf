# Broker configuration for the polyglot OCPP demo.
# The ./generated directory (output of the provision service) is mounted at
# /etc/rabbitmq/demo.

## Users, vhosts, permissions and the shared csms.requests queue.
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/demo/definitions.json
definitions.skip_if_unchanged = true

## Chargers connect from other containers; nobody is restricted to localhost.
loopback_users = none

## Security Profile 1: plain ws:// + HTTP Basic auth.
web_ocpp.tcp.port = 19520

## Security Profiles 2 and 3: wss://. The client certificate is requested but
## optional, so Profile 2 chargers fall back to Basic auth while Profile 3
## chargers authenticate with their certificate, whose CN must equal the
## charge point id.
web_ocpp.ssl.port = 19521
web_ocpp.ssl.cacertfile = /etc/rabbitmq/demo/pki/ca.crt
web_ocpp.ssl.certfile = /etc/rabbitmq/demo/pki/server.crt
web_ocpp.ssl.keyfile = /etc/rabbitmq/demo/pki/server.key
web_ocpp.ssl.verify = verify_peer
web_ocpp.ssl.fail_if_no_peer_cert = false
ssl_cert_login_from = common_name
## rabbit_ssl only derives a login name from a certificate when the broker's
## global ssl_options verify peers, even though no AMQPS listener is enabled.
ssl_options.cacertfile = /etc/rabbitmq/demo/pki/ca.crt
ssl_options.certfile = /etc/rabbitmq/demo/pki/server.crt
ssl_options.keyfile = /etc/rabbitmq/demo/pki/server.key
ssl_options.verify = verify_peer
ssl_options.fail_if_no_peer_cert = false

## More acceptors help absorb the initial connection storm.
web_ocpp.num_acceptors.tcp = 32
web_ocpp.num_acceptors.ssl = 32
web_ocpp.tcp.backlog = 4096
web_ocpp.ssl.backlog = 4096

## Close a charger connection after 5 minutes without any frame.
web_ocpp.ws_opts.idle_timeout = 300000

## 10k connections plus 10k queues: keep management stats collection cheap.
collect_statistics_interval = 10000
management.rates_mode = basic

vm_memory_high_watermark.relative = 0.7
