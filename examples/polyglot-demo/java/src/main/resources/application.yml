server:
  port: ${HTTP_PORT:8080}

spring:
  application:
    name: csms-java
  # Tomcat, listener containers and @Scheduled tasks run on virtual threads,
  # so the command API can simply block while waiting for a charger's answer.
  threads:
    virtual:
      enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:csms}
    password: ${RABBITMQ_PASS:csms}
    virtual-host: ${RABBITMQ_VHOST:csms-java}
    cache:
      channel:
        size: 64
    listener:
      simple:
        prefetch: ${PREFETCH:200}
        concurrency: ${WORKER_CONCURRENCY:8}
        acknowledge-mode: auto
        default-requeue-rejected: false

csms:
  implementation: java
  heartbeat-interval: ${HEARTBEAT_INTERVAL:60}
  command-timeout: ${COMMAND_TIMEOUT_MS:15000}ms
  management-url: ${RABBITMQ_MANAGEMENT_URL:http://localhost:15672}
  management-user: ${RABBITMQ_USER:csms}
  management-password: ${RABBITMQ_PASS:csms}
  vhost: ${RABBITMQ_VHOST:csms-java}

logging:
  level:
    root: info
