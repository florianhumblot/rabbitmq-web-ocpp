apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: rabbitmq-management
spec:
  secretTargetRef:
    # Management API URL including the vhost, from the overlay's secret.
    - parameter: host
      name: keda-rabbitmq
      key: host
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: csms-worker
spec:
  scaleTargetRef:
    name: csms-worker
  minReplicaCount: 2
  maxReplicaCount: 20
  pollingInterval: 10
  cooldownPeriod: 120
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 120
  triggers:
    - type: rabbitmq
      metadata:
        protocol: http
        queueName: csms.requests
        mode: QueueLength
        value: "500"
      authenticationRef:
        name: rabbitmq-management
    - type: rabbitmq
      metadata:
        protocol: http
        queueName: csms.requests
        mode: MessageRate
        value: "400"
      authenticationRef:
        name: rabbitmq-management
