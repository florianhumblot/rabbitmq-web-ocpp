# Dashboard: page, snapshot WebSocket, /api/ forwarded to csms-api. Each
# replica taps all OCPP traffic of the vhost, so it is replicated for
# availability rather than autoscaled; browsers reconnect to any replica.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: csms-dashboard
  labels:
    app.kubernetes.io/name: csms
    app.kubernetes.io/component: dashboard
spec:
  replicas: 2
  # Rolling deployments: start a new pod, wait until it is ready, then stop
  # an old one. Never fewer ready pods than desired.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: csms
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: csms
        app.kubernetes.io/component: dashboard
    spec:
      # SIGTERM starts the drain (stop consuming, finish in-flight work).
      terminationGracePeriodSeconds: 40
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: csms
              app.kubernetes.io/component: dashboard
      containers:
        - name: csms
          image: csms
          env:
            - name: CSMS_ROLES
              value: dashboard
            - name: COMMAND_API_URL
              value: http://csms-api:8080
          envFrom:
            - configMapRef:
                name: csms-config
            - secretRef:
                name: csms-rabbitmq
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            # Fails as soon as the process starts draining, and while
            # RabbitMQ or Valkey are unreachable.
            httpGet:
              path: /healthz/ready
              port: http
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            # Let endpoints and load balancers stop routing here before the
            # process receives SIGTERM.
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: csms-dashboard
spec:
  selector:
    app.kubernetes.io/name: csms
    app.kubernetes.io/component: dashboard
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: csms-dashboard
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: csms
      app.kubernetes.io/component: dashboard
