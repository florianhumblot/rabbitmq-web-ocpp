# CPU-based autoscaling (needs metrics-server). For workers, ../keda scales on
# what actually matters for a queue consumer: backlog and message rate.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: csms-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: csms-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      # Scale in slowly: a drained worker's prefetched messages go back to
      # the queue, so flapping costs latency.
      stabilizationWindowSeconds: 120
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: csms-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: csms-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
